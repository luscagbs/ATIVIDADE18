{% extends "core/base.html" %}

{% block title %}
Novo Evento
{% endblock %}

{% block content %}

<h1>Cadastrar novo evento</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn" type="submit">
        Salvar evento
    </button>
</form>

<br>

<a class="btn" href="{% url 'listar_eventos' %}">
    Voltar para eventos
</a>

{% endblock %}
