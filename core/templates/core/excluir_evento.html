{% extends "core/base.html" %}

{% block title %}
Excluir Evento
{% endblock %}

{% block content %}

<h1>Excluir evento</h1>

<p>
    Tem certeza que deseja excluir o evento
    <strong>{{ evento.nome }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button class="btn" type="submit">
        Sim, excluir
    </button>
</form>

<br>

<a class="btn" href="{% url 'listar_eventos' %}">
    Cancelar
</a>

{% endblock %}
