{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Eventos</h1>

        <a class="btn" href="{% url 'criar_evento' %}">
            + Cadastrar novo evento
        </a>

        {% if eventos %}

            {% for evento in eventos %}

                <div class="evento">

                    <h2>{{ evento.nome }}</h2>

                    <p>
                        <strong>Descrição:</strong>
                        {{ evento.descricao }}
                    </p>

                    <p>
                        <strong>Data:</strong>
                        {{ evento.data|date:"d/m/Y" }}
                    </p>

                </div>

            {% endfor %}

        {% else %}

            <div class="evento">
                <p>Nenhum evento cadastrado.</p>
            </div>

        {% endif %}

    </div>

</body>
</html>
