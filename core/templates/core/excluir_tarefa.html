{% extends "core/base.html" %}

{% block title %}
Excluir Tarefa
{% endblock %}

{% block content %}

<h1>Excluir tarefa</h1>

<p>
    Tem certeza que deseja excluir a tarefa
    <strong>{{ tarefa.titulo }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button class="btn" type="submit">
        Sim, excluir
    </button>
</form>

<br>

<a class="btn" href="{% url 'listar_tarefas' %}">
    Cancelar
</a>

{% endblock %}
