{% extends "core/base.html" %}

{% block title %}
Nova Tarefa
{% endblock %}

{% block content %}

<h1>Cadastrar nova tarefa</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn" type="submit">
        Salvar tarefa
    </button>
</form>

<br>

<a class="btn" href="{% url 'listar_tarefas' %}">
    Voltar para tarefas
</a>

{% endblock %}
